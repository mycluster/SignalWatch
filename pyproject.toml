[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "signalwatch"
version = "0.1.0"
description = "GDELT-powered supply chain risk monitoring platform."
readme = "readMe.md"
requires-python = ">=3.9"
dependencies = [
    "azure-identity>=1.17.0",
    "azure-storage-file-datalake>=12.15.0",
    "cryptography<42; python_version == '3.9'",
    "fastapi>=0.115.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary]>=3.2.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "docker>=7.1.0",
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
src = ["src", "jobs", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
