services:
  postgres:
    image: postgres:16-alpine
    container_name: signalwatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-signalwatch}
      POSTGRES_USER: ${POSTGRES_USER:-signalwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signalwatch}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-signalwatch} -d ${POSTGRES_DB:-signalwatch}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
